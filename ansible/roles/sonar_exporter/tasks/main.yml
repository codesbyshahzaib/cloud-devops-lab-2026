---
- name: Create sonar_exporter directory
  file:
    path: /opt/devops/sonar_exporter
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0755'

- name: Copy exporter script
  copy:
    src: exporter.py
    dest: /opt/devops/sonar_exporter/exporter.py
    owner: "1000"
    group: "1000"
    mode: '0755'

- name: Copy Dockerfile
  copy:
    src: Dockerfile
    dest: /opt/devops/sonar_exporter/Dockerfile
    owner: "1000"
    group: "1000"
    mode: '0644'
