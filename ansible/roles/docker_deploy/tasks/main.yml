---
# -------------------------------------------------------
# Role: docker_deploy
# Purpose: Create service directories, apply system tuning,
#          deploy docker-compose.yml, and manage container
#          lifecycle.
# Targets: App Server only
# -------------------------------------------------------

# --- System Tuning ---
- name: Increase vm.max_map_count for SonarQube Elasticsearch
  sysctl:
    name: vm.max_map_count
    value: '262144'
    state: present
    reload: yes

# --- Directory Creation ---
- name: Create service directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0755'
  loop:
    - /opt/devops
    - /opt/devops/jenkins
    - /opt/devops/jenkins_data
    - /opt/devops/postgres_data
    - /opt/devops/sonar_data
    - /opt/devops/sonar_extensions
    - /opt/devops/sonar_extensions/plugins
    - /opt/devops/sonar_logs
    - /opt/devops/nginx
    - /opt/devops/nginx/html
    - /opt/devops/prometheus
    - /opt/devops/grafana_provisioning
    - /opt/devops/grafana_provisioning/datasources
    - /opt/devops/grafana_provisioning/dashboards
    - /opt/devops/grafana_dashboards


- name: Create Prometheus data directory (owned by nobody:65534)
  file:
    path: /opt/devops/prometheus_data
    state: directory
    owner: "65534"
    group: "65534"
    mode: '0775'

- name: Create Grafana data directory (owned by grafana:472)
  file:
    path: /opt/devops/grafana_data
    state: directory
    owner: "472"
    group: "472"
    mode: '0775'


