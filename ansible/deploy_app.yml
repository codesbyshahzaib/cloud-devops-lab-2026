---
- name: Deploy Node.js Application
  hosts: localhost
  connection: local
  vars:
    dockerhub_user: "shahzaib"
    image_tag: "latest"
  tasks:
    - name: Pull latest Node.js app image from DockerHub
      shell: "docker pull {{ dockerhub_user }}/node-app:{{ image_tag }}"

    - name: Stop and remove existing node-app container
      shell: "docker stop node-app && docker rm node-app"
      failed_when: false

    - name: Start new node-app container on devops_network
      shell: "docker run -d --name node-app --network devops_network --restart always -p 3000:3000 {{ dockerhub_user }}/node-app:{{ image_tag }}"
